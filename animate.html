:root{--bg:#faf8f4;--ink:#17201c;--muted:#6b716d;--chip:#f3efe7;--brand:#0f6b4f;}
*{box-sizing:border-box}

<body>
<canvas id="cv" width="1200" height="1600"></canvas>
<div class="ui">
  <button id="play">▶ অ্যানিমেশন দেখুন</button>
  <button id="rec" class="alt">🎬 ভিডিও রেকর্ড করুন (12s)</button>
</div>
<p class="hint">রেকর্ড চাপলে ১২ সেকেন্ড অ্যানিমেশন চলবে এবং শেষে ভিডিও ফাইল ডাউনলোড হবে — সরাসরি ফেসবুকে পোস্ট করা যাবে।</p>
<script src="bd_data.js"></script>
<script>
"use strict";
/* ---------------- constants (match Output.jpeg / site emerald theme) ---------------- */
const W=1200,H=1600;
const T={bg:"#f6f2ea",land:"#e3dccd",stroke:"#f6f2ea",v1:"#0f6b4f",v2:"#1f9a70",vStroke:"#f6f2ea",
         ink:"#17201c",muted:"#7a7f78",label:"#ffffff",halo:"#0b3d2e",dot:"#f42a41",track:"#e3dccd"};
const FONT='"Anek Bangla",system-ui,sans-serif';
const MAP={y:250,h:1040};
MAP.s=MAP.h/DATA.h; MAP.w=DATA.w*MAP.s; MAP.x=(W-MAP.w)/2;

const SELECTED=["Gazipur","Narsingdi","Munshiganj","Narayanganj","Shariatpur","Tangail",
  "Kishorganj","Mymensingh","Habiganj","Moulvibazar","Sunamganj","Sylhet",
  "Brahmanbaria","Chandpur","Cumilla","Feni","Noakhali","Lakshmipur",
  "Chattogram","Khagrachhari","Rangamati","Bandarban","Cox's Bazar",
  "Patuakhali","Barishal","Bhola"];

/* timeline (seconds) */
const TL={photo:[.15,.75],sub:[.35,.95],title:[.45,1.05],cnt:[.6,1.15],map:[.9,1.65],
          foot:[1.55,2.1],start:1.7,stag:.28,piece:.38,lag:.10,label:.28,
          settle:[9.4,10.3],dur:12};
const FPS=30;

/* ---------------- helpers ---------------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeOutBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const BND=["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
const bn=n=>String(n).split("").map(ch=>ch>="0"&&ch<="9"?BND[+ch]:ch).join("");
const seg=(t,[a,b])=>clamp((t-a)/(b-a));
function alignX(ctx,text,x,align){const w=ctx.measureText(text).width;return align==="left"?x:align==="right"?x-w:x-w/2;}
function textAt(ctx,text,x,y,align,stroke){const ax=alignX(ctx,text,x,align);if(stroke)ctx.strokeText(text,ax,y);ctx.fillText(text,ax,y);}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* nearest-neighbour journey order starting from Gazipur (home) */
const PATH_ORDER=(()=>{
  const pt=n=>{const f=DATA.f.find(f=>f.n===n);return{x:f.c[0],y:f.c[1]};};
  const pts=Object.fromEntries(SELECTED.map(n=>[n,pt(n)]));
  let cur="Gazipur"; const rest=new Set(SELECTED); rest.delete(cur); const out=[cur];
  while(rest.size){let best=null,bd=1e9;
    for(const n of rest){const d=Math.hypot(pts[n].x-pts[cur].x,pts[n].y-pts[cur].y);if(d<bd){bd=d;best=n;}}
    out.push(best);rest.delete(best);cur=best;}
  return out;
})();
const ORDER_INDEX=Object.fromEntries(PATH_ORDER.map((n,i)=>[n,i]));
const SEL_SET=new Set(SELECTED);

/* canvas-space centroids in journey order */
const ROUTE=PATH_ORDER.map(n=>{const f=DATA.f.find(f=>f.n===n);
  return{en:n,bn:BN[n],c:[MAP.x+f.c[0]*MAP.s, MAP.y+f.c[1]*MAP.s],dv:f.dv};});

/* label placement — same algorithm as unseenbangladesh.com */
let LABELS={};
function placeLabels(){
  const ctx=cv.getContext("2d");
  ctx.font=`600 20px ${FONT}`;
  const placed=[];
  const byY=[...ROUTE].sort((a,b)=>a.c[1]-b.c[1]);
  const tries=[[0,-14],[0,26],[12,7],[-12,7],[0,-36],[0,48],[30,-14],[-30,-14],[30,26],[-30,26]];
  for(const f of byY){
    const [cx,cy]=f.c;
    const w=ctx.measureText(f.bn).width+8,h=26;
    let pick=null;
    for(const [dx,dy] of tries){
      const align=dx>0?"left":dx<0?"right":"center";
      const x0=align==="left"?cx+dx:align==="right"?cx+dx-w:cx-w/2, y0=cy+dy-h+4;
      const box={x:x0,y:y0,w,h};
      if(!placed.some(b=>b.x<box.x+box.w&&box.x<b.x+b.w&&b.y<box.y+box.h&&box.y<b.y+b.h)){pick={box,align,tx:cx+dx,ty:cy+dy};break}
    }
    if(!pick){const box={x:cx-w/2,y:cy-32,w,h};pick={box,align:"center",tx:cx,ty:cy-14}}
    placed.push(pick.box,{x:cx-5,y:cy-5,w:10,h:10});
    LABELS[f.en]={...pick,cx,cy,bn:f.bn};
  }
}

/* ---------------- state for animated quantities ---------------- */
function stateAt(t){
  let landed=0,fracPieces=0,curP=0,curI=-1;
  for(let i=0;i<ROUTE.length;i++){
    const p=clamp((t-(TL.start+i*TL.stag))/TL.piece);
    if(p>=1)landed++; else if(p>0){curP=p;curI=i;}
    fracPieces+=easeOutCubic(p);
  }
  const frac=fracPieces/64;
  const divs=new Set();
  for(let i=0;i<ROUTE.length;i++){
    const p=clamp((t-(TL.start+i*TL.stag))/TL.piece);
    if(p>=1)divs.add(ROUTE[i].dv);
  }
  return{landed,frac,pct:Math.round(frac*100),curP,curI,divs:divs.size};
}

/* ---------------- drawing ---------------- */
function drawHeader(t){
  const ctx=cv.getContext("2d");
  /* photo */
  const pa=easeOutCubic(seg(t,TL.photo));
  if(pa>0){const x=80,y=52,size=168,rad=32;
    ctx.save();ctx.globalAlpha=pa;
    ctx.translate(x+size/2,y+size/2);ctx.scale(.82+.18*pa,.82+.18*pa);ctx.translate(-(x+size/2),-(y+size/2));
    const rg=ctx.createLinearGradient(x,y,x+size,y+size);rg.addColorStop(0,T.v1);rg.addColorStop(1,T.v2);
    roundRect(ctx,x-7,y-7,size+14,size+14,rad+7);ctx.fillStyle=rg;ctx.fill();
    roundRect(ctx,x-2,y-2,size+4,size+4,rad+2);ctx.fillStyle=T.bg;ctx.fill();
    roundRect(ctx,x+1,y+1,size-2,size-2,rad-1);ctx.clip();
    if(photoImg.complete&&photoImg.naturalWidth){const iw=photoImg.naturalWidth,ih=photoImg.naturalHeight,k=Math.max(size/iw,size/ih);
      ctx.drawImage(photoImg,x+size/2-iw*k/2,y+size/2-ih*k/2,iw*k,ih*k);}
    ctx.restore();}
  const tx=80+168+40;
  /* subtitle */
  const sa=easeOutCubic(seg(t,TL.sub));
  if(sa>0){ctx.save();ctx.globalAlpha=sa;
    ctx.font=`600 24px ${FONT}`;ctx.fillStyle=T.muted;
    ctx.textBaseline="alphabetic";
    ctx.fillText("বাংলাদেশ ভ্রমণ ম্যাপ",tx,112+14*(1-sa));ctx.restore();}
  /* title */
  const ta=easeOutCubic(seg(t,TL.title));
  if(ta>0){ctx.save();ctx.globalAlpha=ta;
    ctx.font=`800 64px ${FONT}`;ctx.fillStyle=T.ink;
    ctx.fillText("আমার বাংলাদেশ",tx,190+18*(1-ta));ctx.restore();}
  /* counter */
  const st=stateAt(t);
  const ca=easeOutCubic(seg(t,TL.cnt));
  if(ca>0){
    /* pulse on each landing */
    let pulse=0;
    for(let i=0;i<ROUTE.length;i++){
      const t0=TL.start+i*TL.stag;
      if(t>=t0&&t<t0+.3){pulse=Math.max(pulse,1-(t-t0)/.3);}
    }
    const s=1+.10*pulse*pulse;
    const num=bn(st.landed),rest="/৬৪";
    ctx.save();ctx.globalAlpha=ca;
    ctx.font=`700 52px ${FONT}`;const rw=ctx.measureText(rest).width;
    ctx.font=`800 92px ${FONT}`;const nw=ctx.measureText(num).width;
    const right=W-80,base=208;
    const cx=right-(nw+8+rw)/2,cy=base-34;
    ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy);
    ctx.textBaseline="alphabetic";
    ctx.font=`800 92px ${FONT}`;ctx.fillStyle=T.v1;
    textAt(ctx,num,right-8-rw,base,"right");
    ctx.font=`700 52px ${FONT}`;ctx.fillStyle="#9c9a92";
    textAt(ctx,rest,right,base,"right");
    ctx.restore();}
}
function drawMapBase(t){
  const ctx=cv.getContext("2d");
  const a=easeOutCubic(seg(t,TL.map));
  if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;
  const cx=MAP.x+MAP.w/2,cy=MAP.y+MAP.h/2;
  const s=.985+.015*a;
  ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy);
  ctx.translate(MAP.x,MAP.y);ctx.scale(MAP.s,MAP.s);
  ctx.lineJoin="round";
  for(const f of DATA.f){
    const p=new Path2D(f.d);
    ctx.fillStyle=T.land;ctx.fill(p);
    ctx.strokeStyle=T.stroke;ctx.lineWidth=1/MAP.s*1.4;ctx.stroke(p);
  }
  ctx.restore();
}
function drawRoute(t){
  const st=stateAt(t);
  if(st.landed+ (st.curI>=0?1:0) <1)return;
  const settle=seg(t,TL.settle);
  const alpha=(.85-.45*easeOutCubic(settle));
  const ctx=cv.getContext("2d");
  ctx.save();ctx.globalAlpha=alpha;
  ctx.strokeStyle=T.dot;ctx.lineWidth=2.5;ctx.setLineDash([7,7]);
  ctx.lineDashOffset=-(t*30)%14;
  ctx.beginPath();
  const nDone=Math.min(ROUTE.length-1,st.landed+(st.curI>=0?1:0)-1);
  for(let j=0;j<ROUTE.length-1;j++){
    const p=clamp((t-(TL.start+(j+1)*TL.stag))/TL.piece);
    if(p<=0)break;
    const [x0,y0]=ROUTE[j].c,[x1,y1]=ROUTE[j+1].c;
    const e=easeOutCubic(p);
    if(j===st.curI&&p<1){ctx.moveTo(x0,y0);ctx.lineTo(x0+(x1-x0)*e,y0+(y1-y0)*e);}
    else{ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);}
  }
  ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
}
function drawPieces(t){
  const ctx=cv.getContext("2d");
  ctx.save();
  ctx.translate(MAP.x,MAP.y);ctx.scale(MAP.s,MAP.s);
  ctx.lineJoin="round";
  /* gradient across the whole map, like the site */
  const vg=ctx.createLinearGradient(0,0,DATA.w,DATA.h);
  vg.addColorStop(0,T.v1);vg.addColorStop(1,T.v2);
  for(let i=0;i<ROUTE.length;i++){
    const t0=TL.start+i*TL.stag;
    const p=clamp((t-t0)/TL.piece);
    if(p<=0)continue;
    const f=DATA.f.find(f=>f.n===ROUTE[i].en);
    const path=new Path2D(f.d);
    const e=easeOutBack(p);
    const sc=.52+.48*e;
    const [mx,my]=f.c;
    ctx.save();
    ctx.globalAlpha=clamp(p*1.6);
    ctx.translate(mx,my);ctx.scale(sc,sc);ctx.translate(-mx,-my);
    ctx.fillStyle=vg;ctx.fill(path);
    if(p<.65){ctx.save();ctx.globalAlpha=(1-p/.65)*.9;ctx.strokeStyle="#ffffff";ctx.lineWidth=4/MAP.s;ctx.stroke(path);ctx.restore()}
    ctx.strokeStyle=T.vStroke;ctx.lineWidth=1.4/MAP.s;ctx.stroke(path);
    ctx.restore();
  }
  ctx.restore();
}
function drawLabels(t){
  const ctx=cv.getContext("2d");
  ctx.save();ctx.textBaseline="alphabetic";
  for(let i=0;i<ROUTE.length;i++){
    const t0=TL.start+i*TL.stag+TL.lag;
    const p=clamp((t-t0)/TL.label);
    if(p<=0)continue;
    const e=easeOutCubic(p);
    const L=LABELS[ROUTE[i].en];if(!L)continue;
    ctx.save();ctx.globalAlpha=e;
    /* dot */
    const ds=.4+.6*easeOutBack(clamp(p*1.3));
    ctx.beginPath();ctx.arc(L.cx,L.cy,4.5*ds,0,Math.PI*2);
    ctx.fillStyle=T.dot;ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle="#fff";ctx.stroke();
    /* label */
    const dy=10*(1-e);
    ctx.font=`600 20px ${FONT}`;
    ctx.lineJoin="round";ctx.lineWidth=5;ctx.strokeStyle=T.halo;
    ctx.fillStyle=T.label;
    textAt(ctx,L.bn,L.tx,L.ty+dy,L.align,true);
    ctx.restore();
  }
  ctx.restore();
}
function drawFooter(t){
  const ctx=cv.getContext("2d");
  const a=easeOutCubic(seg(t,TL.foot));
  if(a<=0)return;
  const st=stateAt(t);
  ctx.save();ctx.globalAlpha=a;
  const fy=1455;
  /* progress track + fill */
  ctx.fillStyle=T.track;roundRect(ctx,80,fy,W-160,12,6);ctx.fill();
  if(st.frac>0){
    const pg=ctx.createLinearGradient(80,0,W-80,0);pg.addColorStop(0,T.v1);pg.addColorStop(1,T.v2);
    ctx.fillStyle=pg;roundRect(ctx,80,fy,Math.max(12,(W-160)*Math.min(1,st.frac)),12,6);ctx.fill();
  }
  const by=1544;
  ctx.font=`700 24px ${FONT}`;ctx.fillStyle=T.ink;
  ctx.fillText(`${bn(st.pct)}% বাংলাদেশ ঘুরা হয়েছে`,80,by);
  ctx.font=`500 20px ${FONT}`;ctx.fillStyle=T.muted;
  textAt(ctx,`${bn(st.landed)}টি জেলা · ৮টির মধ্যে ${bn(st.divs)}টি বিভাগ`,W-80,by,"right");
  ctx.restore();
}

function SEEK(t){
  t=clamp(t,0,TL.dur);
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=T.bg;ctx.fillRect(0,0,W,H);
  ctx.restore();
  drawMapBase(t);
  drawRoute(t);
  drawPieces(t);
  drawLabels(t);
  drawHeader(t);
  drawFooter(t);
  return "ok";
}

/* ---------------- ready gate ---------------- */
(async function(){
  try{
    await Promise.all([
      document.fonts.load(`800 64px ${FONT}`,"আমার বাংলাদেশ"),
      document.fonts.load(`700 24px ${FONT}`,"০১২৩৪৫৬৭৮৯"),
      document.fonts.load(`600 20px ${FONT}`,"সিলেট চট্টগ্রাম"),
      document.fonts.load(`500 20px ${FONT}`,"জেলা বিভাগ"),
    ]);
    await document.fonts.ready;
    if(!photoImg.complete) await new Promise(r=>{photoImg.onload=r;photoImg.onerror=r});
    placeLabels();
    SEEK(0);
  }catch(e){console.error(e);window.__ERR=String(e&&e.stack||e)}
  window.__READY=1;
})();

/* ---------------- UI ---------------- */
if(location.search.includes("render"))document.body.classList.add("render");
let playing=false;
document.getElementById("play").onclick=()=>{
  if(playing)return;playing=true;
  const t0=performance.now();
  (function loop(){
    if(!playing)return;
    const t=(performance.now()-t0)/1000;
    if(t>=TL.dur){SEEK(TL.dur);playing=false;return}
    SEEK(t);requestAnimationFrame(loop);
  })();
};
document.getElementById("rec").onclick=async function(){
  if(playing)return;
  const btn=this;btn.disabled=true;playing=true;
  const stream=cv.captureStream(FPS);
  const mime=["video/mp4","video/webm;codecs=vp9","video/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"";
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:undefined);
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:mime||"video/webm"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="amar-bangladesh."+((mime||"").includes("mp4")?"mp4":"webm");
    a.click();
    btn.disabled=false;playing=false;
  };
  rec.start();
  const t0=performance.now();
  await new Promise(done=>{
    (function loop(){
      const t=(performance.now()-t0)/1000;
      if(t>=TL.dur){SEEK(TL.dur);done();return}
      SEEK(t);requestAnimationFrame(loop);
    })();
  });
  setTimeout(()=>rec.stop(),400);
};
</script>
